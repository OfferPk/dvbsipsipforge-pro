<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111a28"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182337"/>
      <stop offset="100%" stop-color="#101826"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Studio Frame -->
  <rect x="30" y="30" width="1140" height="640" rx="12" fill="#0d1522" stroke="#243550" stroke-width="2" />

  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="52" rx="12" fill="#131e30" />
  <circle cx="60" cy="56" r="7" fill="#ff5f56" />
  <circle cx="85" cy="56" r="7" fill="#ffbd2e" />
  <circle cx="110" cy="56" r="7" fill="#27c93f" />

  <!-- Title -->
  <text x="140" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold">
    📡 DVBSIPSIPForge Pro v1.0.0 — DVB-SI (ETSI EN 300 468) &amp; ATSC PSIP Studio
  </text>
  <rect x="990" y="44" width="160" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="1005" y="62" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">10/10 PASS • CERTIFIED</text>

  <!-- Nav Tabs -->
  <rect x="50" y="102" width="1100" height="42" rx="8" fill="#111a28" stroke="#1f2d47" stroke-width="1" />
  <rect x="54" y="106" width="280" height="34" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5" />
  <text x="75" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">1. Multiplex Table Builder</text>
  
  <text x="370" y="128" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">2. Section Dissector &amp; Parser</text>
  <text x="670" y="128" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">3. Service List &amp; EPG Grid</text>
  <text x="930" y="128" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">4. 10-Point Normative Auditor</text>

  <!-- Left Column: Table Builder -->
  <rect x="50" y="162" width="530" height="485" rx="10" fill="url(#cardGrad)" stroke="#22334f" stroke-width="1" />
  <text x="75" y="196" fill="#3b82f6" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Multiplex &amp; Service Configuration</text>

  <text x="75" y="235" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Table Type &amp; Transport Stream ID:</text>
  <rect x="75" y="245" width="230" height="35" rx="6" fill="#0b121e" stroke="#2a3d5e" stroke-width="1" />
  <text x="90" y="268" fill="#e2e8f0" font-family="monospace" font-size="12">SDT (0x42) — Actual TS</text>
  <rect x="325" y="245" width="230" height="35" rx="6" fill="#0b121e" stroke="#2a3d5e" stroke-width="1" />
  <text x="340" y="268" fill="#e2e8f0" font-family="monospace" font-size="12">TSID: 0x0001 (1)</text>

  <text x="75" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Original Network ID &amp; Service ID:</text>
  <rect x="75" y="315" width="230" height="35" rx="6" fill="#0b121e" stroke="#2a3d5e" stroke-width="1" />
  <text x="90" y="338" fill="#06b6d4" font-family="monospace" font-size="12">ONID: 0x20FA (8442 UK)</text>
  <rect x="325" y="315" width="230" height="35" rx="6" fill="#0b121e" stroke="#2a3d5e" stroke-width="1" />
  <text x="340" y="338" fill="#06b6d4" font-family="monospace" font-size="12">SID: 101 (Program 101)</text>

  <text x="75" y="375" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Provider Name &amp; Service Name:</text>
  <rect x="75" y="385" width="230" height="35" rx="6" fill="#0b121e" stroke="#2a3d5e" stroke-width="1" />
  <text x="90" y="408" fill="#e2e8f0" font-family="sans-serif" font-size="12">BBC Broadcast</text>
  <rect x="325" y="385" width="230" height="35" rx="6" fill="#0b121e" stroke="#2a3d5e" stroke-width="1" />
  <text x="340" y="408" fill="#38ef7d" font-family="sans-serif" font-size="12" font-weight="bold">BBC ONE HD</text>

  <rect x="75" y="445" width="480" height="80" rx="8" fill="#0b121e" stroke="#243450" stroke-width="1" />
  <text x="90" y="470" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">DVB-SI SERVICE DESCRIPTOR (0x48)</text>
  <text x="90" y="498" fill="#3b82f6" font-family="monospace" font-size="12">service_type: 0x01 (Digital TV) | running_status: 4 (Running)</text>

  <rect x="75" y="550" width="230" height="40" rx="6" fill="url(#headerGrad)" />
  <text x="110" y="575" fill="#040810" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Synthesize Section</text>

  <!-- Right Column: Dissect & Hex Stream -->
  <rect x="600" y="162" width="550" height="485" rx="10" fill="url(#cardGrad)" stroke="#22334f" stroke-width="1" />
  <text x="625" y="196" fill="#3b82f6" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Binary Section &amp; MPEG-2 CRC-32</text>

  <!-- Metric Badges -->
  <rect x="625" y="215" width="240" height="75" rx="8" fill="#0b121e" stroke="#243450" stroke-width="1" />
  <text x="640" y="238" fill="#7d91b0" font-family="-apple-system, sans-serif" font-size="11">MPEG-2 CRC-32 POLYNOMIAL</text>
  <text x="640" y="268" fill="#10b981" font-family="monospace" font-size="18" font-weight="bold">0x8B32FA10 (PASS)</text>

  <rect x="885" y="215" width="240" height="75" rx="8" fill="#0b121e" stroke="#243450" stroke-width="1" />
  <text x="900" y="238" fill="#7d91b0" font-family="-apple-system, sans-serif" font-size="11">SECTION LENGTH</text>
  <text x="900" y="268" fill="#3b82f6" font-family="monospace" font-size="18" font-weight="bold">38 Bytes (Table 0x42)</text>

  <!-- Hex Byte Stream -->
  <text x="625" y="315" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">RAW SECTION HEX BYTESTREAM (PID 0x0011):</text>
  <rect x="625" y="325" width="500" height="150" rx="6" fill="#070c14" stroke="#243450" stroke-width="1" />
  <text x="635" y="348" fill="#3b82f6" font-family="monospace" font-size="10">42f0260001c1000020faff0065fd801b</text>
  <text x="635" y="366" fill="#cbd5e1" font-family="monospace" font-size="10">4819010d4242432042726f6164636173</text>
  <text x="635" y="384" fill="#cbd5e1" font-family="monospace" font-size="10">740a424243204f4e45204844</text>
  <text x="635" y="402" fill="#10b981" font-family="monospace" font-size="10">8b32fa10 (CRC-32 Valid)</text>

  <!-- Channel Preview Banner -->
  <rect x="625" y="500" width="500" height="60" rx="8" fill="#0b121e" stroke="#243450" stroke-width="1" />
  <text x="645" y="525" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">EPG CHANNEL IDENTIFIER</text>
  <text x="645" y="548" fill="#38ef7d" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">Ch 101: BBC ONE HD • Free-To-Air (FTA)</text>
</svg>
